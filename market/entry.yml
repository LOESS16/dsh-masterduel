url: https://github.com/LOESS16/dsh-masterduel
name: LOESS16/dsh-masterduel
category: tools
description:
  en: 'Master Duel utility panel for DSH: card lookup with banlist filters, related cards, a deck builder with engine-tested opening hands and hand_odds opening probabilities, deck-type rankings, and deck checking. Card images and text are fetched from third-party sources at runtime; the plugin bundles no card data and requires the separate master-duel-ai-advisor MCP server.'
  zh: '面向 DSH 的 Master Duel 工具面板：带禁限筛选的查卡、相关卡片、支持规则引擎先手实测与 hand_odds 起手概率的组卡器、卡组类型排行、卡组检查。卡图与卡文在运行时从第三方来源获取，插件不打包卡牌数据；需要单独安装 master-duel-ai-advisor MCP。'
